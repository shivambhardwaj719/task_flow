# Render Blueprint Specification for TaskFlow
services:
  # Web API Service (FastAPI)
  - type: web
    name: taskflow-api
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: taskflow-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: taskflow-redis
          property: connectionString

  # Background Worker (Celery)
  - type: worker
    name: taskflow-worker
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "celery -A app.workers.celery_app.celery_app worker -B -l info -c 2"
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: taskflow-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: taskflow-redis
          property: connectionString

databases:
  - name: taskflow-postgres
    databaseName: taskflow_db
    user: taskflow
    plan: free

# Managed Redis instance
redis:
  - name: taskflow-redis
    plan: free
    ipAllowList: []
